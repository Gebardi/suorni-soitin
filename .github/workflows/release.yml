name: Julkaise lisäosa
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rakenna zip
        run: zip -qr suorni-soitin.zip suorni-soitin
      - name: Luo julkaisu
        uses: softprops/action-gh-release@v2
        with:
          files: suorni-soitin.zip
          generate_release_notes: true
