name: Julkaise lisäosa
on:
  push:
    branches: [main]
    paths: ['suorni-soitin/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lue versio
        id: v
        run: |
          VER=$(grep -m1 "SUORNI_VER'" suorni-soitin/suorni-soitin.php | sed -E "s/.*'SUORNI_VER', *'([^']+)'.*/\1/")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Rakenna zip ja julkaise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.ver }}"
          TAG="v$VER"
          zip -qr suorni-soitin.zip suorni-soitin
          if gh release view "$TAG" >/dev/null 2>&1; then
            N=$(gh release view "$TAG" --json assets --jq '.assets | length')
            DR=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$N" -gt 0 ] && [ "$DR" = "false" ]; then echo "Julkaisu $TAG on jo valmis"; exit 0; fi
            echo "Julkaisu $TAG on keskeneräinen, poistetaan ja tehdään uudelleen"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          for i in 1 2 3; do
            if gh release create "$TAG" suorni-soitin.zip --target "${GITHUB_SHA}" --title "$VER" --generate-notes; then exit 0; fi
            echo "Yritys $i epäonnistui"; gh release delete "$TAG" --yes --cleanup-tag || true; sleep 10
          done
          exit 1
